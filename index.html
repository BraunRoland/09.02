<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>09.02</title>
  </head>
  <body>
    <div id="app">
      <div class="container" id="tablazat">
        <div class="row">
          <div class="col-sm-12">
            <form id="form">
              <div class="mb-3 mt-3">   
                <label for="nev" class="form-label">Név:</label>
                <input type="text" class="form-control" id="nev" placeholder="neved..." name="nev">
              </div>
              <div class="mb-3">
                <label for="szul" class="form-label">Születésnap:</label>
                <input type="date" class="form-control" id="szul" placeholder="születésnapod..." name="szul">
              </div>
              <div class="mb-3">
                <label for="pont" class="form-label">Pontszám:</label>
                <input type="number" class="form-control" id="pont" placeholder="pontszámod..." name="pont">
              </div>
              <div class="mb-3">
                <label for="lak" class="form-label">lakhely:</label>
                <input type="lak" class="form-control" id="lak" placeholder="lakhelyed..." name="lak">
              </div>
              <button type="submit" id="sBtn" class="btn btn-primary">Hozáadás</button>
            </form>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12">
            <table class ='table table-bordered'>
              <thead>
                <tr>
                  <th>Név</th>
                  <th>Születésnap</th>
                  <th>Pontszám</th>
                  <th>Lakhely</th>
                  <th></th>
                  </tr>
              </thead>
              <tbody id="tablazatAdat">
                    
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
